# NexusOps 前端站点：静态托管 + 后端反向代理
# 浏览器只与本服务（:80）通信，/api 与 /ws 由 Nginx 在服务端转发，同源无跨域。

# Docker 内置 DNS；配合变量形式 proxy_pass 实现请求期动态解析，
# 后端容器重启/短暂不可用时 Nginx 不会因启动期解析失败而崩溃。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 基础安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;
    gzip_min_length 1024;

    # 静态资源带 hash，可强缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # RESTful API → web(gunicorn:8000)
    # 客户端 X-Request-ID 随请求透传，后端回传的同名响应头也自动带回浏览器
    location /api/ {
        set $upstream_api web:8000;
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # WebSocket → daphne(ASGI:8001)，透传 Upgrade 完成协议升级，长连接放宽读超时
    location /ws/ {
        set $upstream_ws daphne:8001;
        proxy_pass http://$upstream_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA history 路由回退：任意深层路径刷新都返回 index.html，避免 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
